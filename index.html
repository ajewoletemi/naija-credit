<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>NaijaLink Credit – Instant Credit Approval</title>
  <meta name="description" content="Get up to ₦400,000 instant credit. Low interest, secure & fast approval." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <style>
    :root {
      --primary: #a8e063;
      --primary-dark: #8bc34a;
      --accent: #f9d423;
      --dark: #1a1a1a;
      --gray: #6b7280;
      --light: #f8fafc;
      --card-bg: #ffffff;
      --success: #10b981;
      --danger: #ef4444;
      --radius: 16px;
      --shadow: 0 10px 40px rgba(0,0,0,0.08);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #f1f5f9;
      color: var(--dark);
      min-height: 100vh;
      line-height: 1.5;
    }

    .app-container {
      max-width: 430px;
      margin: 0 auto;
      min-height: 100vh;
      background: #f8fafc;
      position: relative;
      overflow-x: hidden;
    }

    /* Header */
    .header {
      background: linear-gradient(135deg, #a8e063 0%, #f9d423 100%);
      padding: 16px 20px 24px;
      color: #1a1a1a;
      position: relative;
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 800;
      font-size: 1.25rem;
    }

    .logo-icon {
      width: 40px;
      height: 40px;
      background: #1a1a1a;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--primary);
      font-weight: 800;
      font-size: 1.4rem;
    }

    .step-indicator {
      display: flex;
      gap: 6px;
      justify-content: center;
      margin-bottom: 8px;
    }

    .step-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: rgba(0,0,0,0.2);
      transition: all 0.3s;
    }

    .step-dot.active {
      background: #1a1a1a;
      width: 24px;
      border-radius: 4px;
    }

    /* Screens */
    .screen {
      display: none;
      padding: 20px;
      animation: fadeIn 0.35s ease;
    }

    .screen.active {
      display: block;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Landing */
    .hero-card {
      background: white;
      border-radius: 24px;
      overflow: hidden;
      box-shadow: var(--shadow);
      margin-bottom: 24px;
    }

    .hero-visual {
      background: linear-gradient(135deg, #a8e063 0%, #f9d423 60%, #fff 100%);
      padding: 28px 20px 20px;
      position: relative;
      min-height: 220px;
    }

    .phone-mock {
      width: 140px;
      background: #1a1a1a;
      border-radius: 18px;
      padding: 8px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.25);
      position: relative;
      z-index: 2;
    }

    .phone-screen {
      background: #f8fafc;
      border-radius: 12px;
      padding: 12px;
      min-height: 180px;
    }

    .virtual-card-mini {
      background: linear-gradient(135deg, #f9d423, #a8e063);
      border-radius: 10px;
      padding: 12px;
      color: #1a1a1a;
      margin-bottom: 10px;
    }

    .virtual-card-mini .brand {
      font-size: 0.7rem;
      font-weight: 700;
      opacity: 0.8;
    }

    .virtual-card-mini .number {
      font-size: 0.75rem;
      letter-spacing: 1px;
      margin: 6px 0;
      font-family: monospace;
    }

    .virtual-card-mini .limit {
      font-size: 1.1rem;
      font-weight: 800;
    }
